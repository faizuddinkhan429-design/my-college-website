<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Feedback Form</title>
</head>
<body>
  <h2>Feedback Form (GET method)</h2>
  <form action="show.php" method="get">
    <label>Name:</label>
    <input type="text" name="name" required minlength="3" maxlength="30"><br><br>

    <label>Email:</label>
    <input type="email" name="email" required><br><br>

    <label>Mobile:</label>
    <input type="text" name="mobile" pattern="[0-9]{10}"
           title="Enter a 10 digit number" required><br><br>

    <label>Rating (1-5):</label>
    <input type="number" name="rating" min="1" max="5" required><br><br>

    <label>Comments:</label><br>
    <textarea name="comments" rows="4" cols="35" required></textarea><br><br>

    <input type="submit" value="Send (GET)">
  </form>

  <h2>Feedback Form (POST method)</h2>
  <form action="show.php" method="post">
    <label>Name:</label>
    <input type="text" name="name" required><br><br>
    <label>Comments:</label>
    <input type="text" name="comments" required><br><br>
    <input type="submit" value="Send (POST)">
  </form>
</body>
</html>
